server:
  port: 8084

spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/XE
    username: ECOM
    password: ECOMPass123
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
    show-sql: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: inventory-service-group
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.ecommerce.inventory.event,com.ecommerce.order.event,com.ecommerce.payment.event,com.ecommerce.*"
    properties:
      spring.json.trusted.packages: "com.ecommerce.inventory.event,com.ecommerce.order.event,com.ecommerce.payment.event,com.ecommerce.*"

app:
  kafka:
    topics:
      order-status: order-status-topic

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
